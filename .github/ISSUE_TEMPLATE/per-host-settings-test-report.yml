      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t5
    attributes:
      label: T5 Host L setup
      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t6
    attributes:
      label: T6 Hosts stay separate
      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t7
    attributes:
