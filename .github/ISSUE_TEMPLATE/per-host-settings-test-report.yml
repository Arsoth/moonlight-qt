name: Test report (per-host settings)
description: Results of the per-host settings test plan on one platform
title: "[Test report] <platform>"
labels: [test-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Follow the [test plan](https://github.com/Arsoth/moonlight-qt/wiki/Test-Plan) and file one report per platform.
        Found a problem? You can also file it on its own with the [problem form](https://github.com/Arsoth/moonlight-qt/issues/new?template=per-host-settings-problem.yml).
  - type: input
    id: commit
    attributes:
      label: Build commit
      description: Shown at the top of the [download page](https://github.com/Arsoth/moonlight-qt/releases/tag/per-host-settings-latest), e.g. 549133bf
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows 10
        - Windows 11
        - Windows on ARM
        - CachyOS
        - Steam Deck (Flatpak)
        - Other Linux
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and hardware
      placeholder: e.g. macOS 26.1, M2 MacBook Air
  - type: input
    id: hosts
    attributes:
      label: Hosts used
      placeholder: e.g. Host W = Apollo 0.4 on Windows 11, Host L = Sunshine 2026.x on Arch
  - type: input
    id: controller
    attributes:
      label: Controller used for the gamepad tests
      placeholder: e.g. Xbox One (Bluetooth), Steam Deck built-in
  - type: dropdown
    id: t1
    attributes:
      label: T1 First look
      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t2
    attributes:
      label: T2 Global settings
      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t3
    attributes:
      label: T3 Selecting a host writes nothing
      options:
        - Not tested
        - Pass
        - Fail
        - Not applicable
      default: 0
  - type: dropdown
    id: t4
    attributes:
